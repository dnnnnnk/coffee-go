

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Вход • Coffee Go</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Arial, sans-serif; margin: 0; padding: 0; }
    .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { width: 100%; max-width: 380px; border: 1px solid rgba(127,127,127,.25); border-radius: 16px; padding: 18px; }
    h1 { margin: 0 0 12px; font-size: 18px; }
    p { margin: 0 0 14px; opacity: .8; font-size: 13px; }
    label { display: block; font-size: 13px; margin: 10px 0 6px; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(127,127,127,.35); outline: none; }
    input:focus { border-color: rgba(65, 140, 255, .9); }
    .btn { width: 100%; margin-top: 14px; padding: 10px 12px; border-radius: 10px; border: 0; cursor: pointer; font-weight: 600; }
    .err { margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; background: rgba(255, 80, 80, .12); border: 1px solid rgba(255, 80, 80, .35); font-size: 13px; }
    .hint { margin-top: 12px; font-size: 12px; opacity: .7; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Вход для кофейни</h1>
      <p>Введите логин и пароль, выданные вашей кофейне.</p>

      {% if error %}
        <div class="err">{{ error }}</div>
      {% endif %}

      <form method="post" action="/login" autocomplete="off">
        <label for="login">Логин</label>
        <input id="login" name="login" type="text" inputmode="text" required maxlength="64" autofocus />

        <label for="password">Пароль</label>
        <input id="password" name="password" type="password" required maxlength="128" />

        <button class="btn" type="submit">Войти</button>
      </form>

      <div class="hint">Если забыли доступ — попросите его у админа проекта.</div>
    </div>
  </div>
</body>
</html>
